<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snapdraken</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #c3a175; }

  /* ================= HERO =================
     Copy this <section>, the <style> and the <script> into your page. */
  .sd-hero {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;              /* avoids the jump when mobile browser chrome hides */
    min-height: 560px;
    overflow: hidden;
    background-color: #c9a87c;          /* butcher paper; JS layers grain on top */
    cursor: pointer;                    /* click to replay the burn */
  }

  .sd-paper-light {
    position: absolute; inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 62% 52% at 46% 40%, rgba(255,244,220,0.42) 0%, rgba(255,240,210,0.13) 45%, rgba(255,235,200,0) 70%),
      radial-gradient(ellipse 90% 80% at 78% 88%, rgba(120,86,48,0.20) 0%, rgba(120,86,48,0) 60%),
      radial-gradient(ellipse 120% 100% at 50% 50%, rgba(90,62,32,0) 52%, rgba(84,58,30,0.30) 100%);
  }

  #sdFire   { position: absolute; pointer-events: none; }
  #sdEmbers { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  .sd-logo-wrap {
    position: absolute; inset: 0;
    display: flex; align-items: flex-start; justify-content: center;
    padding-top: clamp(4.5rem, 8vh, 7rem);
    pointer-events: none;
  }
  /* Drawn inside the WebGL pass so the fire can reveal and distort it.
     This <img> is the texture source and the no-WebGL fallback. */
  #sdLogo { max-height: 55vh; max-width: 78vw; }
  .sd-hero.sd-gl #sdLogo { visibility: hidden; }

  @media (max-width: 760px) {
    .sd-logo-wrap { padding-top: max(2.8rem, 5vh); }
    #sdLogo { max-height: 48vh; max-width: 86vw; }
  }

  @media (max-width: 760px) and (max-height: 720px) {
    .sd-logo-wrap { padding-top: 2.5rem; }
    #sdLogo { max-height: 32vh; max-width: 72vw; }
  }

  @media (max-width: 360px) and (max-height: 600px) {
    .sd-logo-wrap { padding-top: 2.15rem; }
    #sdLogo { max-height: 29vh; max-width: 68vw; }
  }

</style>
</head>

<script>
(function () {
  /* ---------- timing, all in seconds ---------- */
  const T_RAMP = 0.30;   // flames come up so it doesn't pop on load
  const T_HOLD = 2.00;   // emblem burns at full
  const T_FADE = 2.50;   // flames die out, leaving the mark

  // iOS turns prefers-reduced-motion ON in Low Power Mode, and plenty of phones
  // have Reduce Motion enabled in accessibility. Rather than showing nothing,
  // those visitors get a short, slow burn with no flicker and no flying sparks.
  const HONOUR_REDUCED_MOTION = true;

  const hero  = document.querySelector('.sd-hero');
  const fireC = document.getElementById('sdFire');
  const embC  = document.getElementById('sdEmbers');
  const logo  = document.getElementById('sdLogo');
  const reduced = HONOUR_REDUCED_MOTION
                  && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const RAMP = reduced ? 0.70 : T_RAMP;
  const HOLD = reduced ? 0.90 : T_HOLD;
  const FADE = reduced ? 1.80 : T_FADE;
  const TIME_SCALE = reduced ? 0.22 : 1;   // slows the flame movement right down

  let qScale = 1;
  const baseDPR = Math.min(window.devicePixelRatio || 1, 1.75);

  /* ============================================================
     PAPER: a seamless butcher-paper tile, generated once
     ============================================================ */
  (function paper() {
    const S = 512;
    const c = document.createElement('canvas');
    c.width = c.height = S;
    const x = c.getContext('2d');

    const hp = (ix, iy, per) => {
      ix = ((ix % per) + per) % per; iy = ((iy % per) + per) % per;
      const n = Math.sin(ix * 127.1 + iy * 311.7) * 43758.5453;
      return n - Math.floor(n);
    };
    const vn = (px, py, per) => {
      const ix = Math.floor(px), iy = Math.floor(py);
      let fx = px - ix, fy = py - iy;
      fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
      const a = hp(ix, iy, per),     b = hp(ix + 1, iy, per);
      const d = hp(ix, iy + 1, per), e = hp(ix + 1, iy + 1, per);
      return a + (b - a) * fx + (d - a) * fy + (a - b - d + e) * fx * fy;
    };
    const fbmT = (u, v) => {
      let s = 0, amp = 0.5, per = 4;
      for (let i = 0; i < 5; i++) { s += amp * vn(u * per, v * per, per); per *= 2; amp *= 0.5; }
      return s;
    };

    x.fillStyle = '#c9a87c';
    x.fillRect(0, 0, S, S);
    const img = x.getImageData(0, 0, S, S);
    const d = img.data;
    for (let y = 0; y < S; y++) {
      for (let px = 0; px < S; px++) {
        const mottle = (fbmT(px / S, y / S) - 0.5) * 22;
        const grain  = (Math.random() - 0.5) * 15;
        const i = (y * S + px) * 4;
        d[i]     = Math.max(0, Math.min(255, d[i]     + mottle * 1.05 + grain));
        d[i + 1] = Math.max(0, Math.min(255, d[i + 1] + mottle * 0.92 + grain));
        d[i + 2] = Math.max(0, Math.min(255, d[i + 2] + mottle * 0.70 + grain * 0.9));
      }
    }
    x.putImageData(img, 0, 0);

    x.lineCap = 'round';
    for (let i = 0; i < 260; i++) {
      const fx = Math.random() * S, fy = Math.random() * S;
      const ang = Math.random() * Math.PI * 2;
      const len = 4 + Math.random() * 16;
      x.strokeStyle = Math.random() < 0.55 ? 'rgba(112,84,50,0.075)' : 'rgba(240,225,196,0.095)';
      x.lineWidth = 0.5 + Math.random() * 0.9;
      for (let ox = -1; ox <= 1; ox++) for (let oy = -1; oy <= 1; oy++) {
        x.beginPath();
        x.moveTo(fx + ox * S, fy + oy * S);
        x.lineTo(fx + ox * S + Math.cos(ang) * len, fy + oy * S + Math.sin(ang) * len);
        x.stroke();
      }
    }

    hero.style.backgroundImage = 'url(' + c.toDataURL('image/png') + ')';
    hero.style.backgroundRepeat = 'repeat';
  })();

  const DEBUG = /sddebug/.test(location.search + location.hash);
  const diag = {
    webgl: false, variant: 'none', shaderError: '', dpr: window.devicePixelRatio || 1,
    reducedMotion: reduced, canvasFilter: false, ua: navigator.userAgent
  };
  window.__snapdrakenDiag = diag;

  const gl = (function () {
    const opts = { alpha: true, premultipliedAlpha: true, antialias: false, depth: false, stencil: false };
    try {
      return fireC.getContext('webgl', opts)
          || fireC.getContext('experimental-webgl', opts)
          || null;
    } catch (e) { diag.shaderError = 'getContext: ' + e.message; return null; }
  })();
  diag.webgl = !!gl;

  function showDiag() {
    let el = document.getElementById('sdDiag');
    if (!el) {
      el = document.createElement('pre');
      el.id = 'sdDiag';
      el.style.cssText = 'position:fixed;left:8px;top:8px;z-index:9999;max-width:92vw;'
        + 'white-space:pre-wrap;font:11px/1.35 ui-monospace,Menlo,monospace;'
        + 'background:rgba(20,14,8,.92);color:#ffd9a8;padding:10px 12px;border-radius:8px;';
      document.body.appendChild(el);
    }
    el.textContent = 'SNAPDRAKEN DIAGNOSTIC\n' + JSON.stringify(diag, null, 1);
  }

  /* ============================================================
     FIRE + CHARRED EMBLEM
     ============================================================ */
  const VSH = `
    attribute vec2 aPos;
    varying vec2 vUv;
    void main() {
      vUv = vec2(aPos.x * 0.5 + 0.5, 0.5 - aPos.y * 0.5);
      gl_Position = vec4(aPos, 0.0, 1.0);
    }`;

  // Built per-variant. Two things commonly kill this shader on phones:
  //  - highp is not guaranteed in fragment shaders, so it is feature-guarded
  //  - the full version is heavy, so a cut-down variant exists as a fallback
  const FSH = (o) => `
${o.prec}
#define OCT ${o.oct}
#define STEPS ${o.steps}
#define SHIMMER ${o.shimmer ? 1 : 0}
    varying vec2 vUv;
    uniform sampler2D uLogo;   // charred emblem, native resolution
    uniform sampler2D uMask;   // emblem alpha, lightly blurred
    uniform sampler2D uGlow;   // tight blur -> contour band
    uniform sampler2D uBloom;  // wide blur  -> cast light and smoke source
    uniform sampler2D uSrc;    // upward-facing rim: where flame is born
    uniform sampler2D uScorch; // mid blur -> burnt-paper halo
    uniform float uT;
    uniform float uFade;       // global fire intensity, 1 -> 0
    uniform vec2  uAspect;
    uniform vec4  uRect;

    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }
    float noise(vec2 p){
      vec2 i = floor(p), f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1.0,0.0)), f.x),
                 mix(hash(i + vec2(0.0,1.0)), hash(i + vec2(1.0,1.0)), f.x), f.y);
    }
    const mat2 ROT = mat2(0.864, 0.504, -0.504, 0.864);
    float fbm(vec2 p){
      float v = 0.0, a = 0.5;
      for (int i = 0; i < OCT; i++) { v += a * noise(p); p = ROT * p * 2.03 + vec2(11.3, 7.1); a *= 0.5; }
      return v;
    }
    vec2 warpField(vec2 q, float sc, float sp, float t){
      float a = fbm(q * sc + vec2(0.0, t * sp));
      float b = fbm(q * sc + vec2(37.2, 17.9) + vec2(0.0, t * sp));
      return vec2(a - 0.5, (b - 0.5) * 0.40);
    }
    vec3 fireRamp(float x){
      x = clamp(x, 0.0, 1.0);
      vec3 c = mix(vec3(0.10, 0.005, 0.000), vec3(0.55, 0.045, 0.000), smoothstep(0.00, 0.16, x));
      c = mix(c, vec3(0.95, 0.20, 0.015), smoothstep(0.13, 0.36, x));
      c = mix(c, vec3(1.00, 0.46, 0.060), smoothstep(0.33, 0.56, x));
      c = mix(c, vec3(1.00, 0.70, 0.200), smoothstep(0.53, 0.76, x));
      c = mix(c, vec3(1.00, 0.90, 0.580), smoothstep(0.74, 0.92, x));
      c = mix(c, vec3(1.00, 0.98, 0.900), smoothstep(0.90, 1.00, x));
      return c;
    }

    void main() {
      vec2 uv = vUv;
      vec2 p  = uv * uAspect * 2.6;
      float t = uT;

      float mask = texture2D(uMask,  uv).a;
      float g1   = texture2D(uGlow,  uv).a;
      float g2   = texture2D(uBloom, uv).a;

      // the emblem is present from the first frame; the fire simply dies down over uFade
      float z1 = fbm(p * 1.9 + vec2( t * 0.09, -t * 0.13));
      float z2 = fbm(p * 4.3 + vec2(-t * 0.19,  t * 0.10));
      float patch = smoothstep(0.42, 0.74, z1 * 0.72 + z2 * 0.28);
      float boil  = fbm(p * 4.6 + vec2(0.0, -t * 1.5));

      float heat = patch * uFade;

      // ---------- burn line along the contour ----------
      float band = clamp(g1 * (1.0 - g1) * 4.0, 0.0, 1.0);
      band = pow(band, 2.3);
      float coal = band * heat * (0.30 + 1.05 * boil);

      // ---------- flames, born on upward-facing rims at the burn front ----------
      vec2 w1 = warpField(uv,                   2.4, 1.35, t);
      vec2 w2 = warpField(uv + vec2(0.0, 0.10), 5.6, 2.35, t);

      float tongue   = fbm(vec2(p.x * 2.3, t * 0.95));
      float srcPatch = smoothstep(0.42, 0.74,
                         fbm((p + vec2(0.0, 0.34)) * 1.9 + vec2(t * 0.09, -t * 0.13)));

      // flames shorten as well as dim while they die
      float gate = clamp(0.48 + 0.73 * patch, 0.0, 1.0) * uFade;
      float Hmax = 0.268 * (0.12 + 1.97 * tongue * tongue)
                   * mix(0.43, 1.0, srcPatch) * mix(0.28, 1.0, uFade);

      float span = 0.27;
      float jit  = hash(uv * 913.7 + fract(t) * 47.0);

      float d = 0.0, hAt = 0.0;
      for (int i = 0; i < STEPS; i++) {
        float h  = (float(i) + jit) / float(STEPS) * span;
        float sh = pow(h / span, 1.15);
        vec2  off = (w1 * 0.55 + w2 * 0.45 * sh) * sh * 0.26;
        float m    = texture2D(uSrc, uv + off + vec2(0.0, h)).a;
        float fall = clamp(1.0 - h / max(Hmax, 0.010), 0.0, 1.0);
        float v    = m * fall * fall;
        if (v > d) { d = v; hAt = h; }
      }
      float cool = clamp(hAt / max(Hmax, 0.010), 0.0, 1.0);
      float fil  = smoothstep(0.30, 0.78, fbm(p * 9.0 + vec2(0.0, -t * 3.0)));
      d *= (0.485 + 0.925 * boil) * mix(0.615, 1.275, fil) * gate;

      float T      = d * (1.0 - 0.72 * cool);
      float aFlame = smoothstep(0.016, 0.215, d) * 0.945;
      vec3  cFlame = fireRamp(clamp(T * 1.70, 0.0, 1.0));
      float soot   = smoothstep(0.50, 1.0, cool) * smoothstep(0.02, 0.22, d);
      cFlame = mix(cFlame, vec3(0.075, 0.055, 0.045), soot * 0.55);

      // ---------- burnt paper, left behind permanently ----------
      float gm  = texture2D(uScorch, uv).a;
#if SHIMMER
      float scN = fbm(p * 4.5 + vec2(7.3, 2.1)) * 0.65 + fbm(p * 11.0 + vec2(1.9, 6.4)) * 0.35;
#else
      float scN = fbm(p * 4.5 + vec2(7.3, 2.1));
#endif
      float se  = gm + (scN - 0.5) * 0.28;
      float brown = smoothstep(0.17, 0.47, se);
      float charr = smoothstep(0.47, 0.80, se);
      vec3  scorchCol = mix(vec3(0.44, 0.27, 0.115), vec3(0.065, 0.042, 0.026), charr);
      float aScorch = brown * (0.78 + 0.22 * patch * uFade) * 0.82 * (1.0 - mask * 0.9);

      // ---------- smoke ----------
      float smokeN = fbm(p * 1.4 + vec2(sin(t * 0.16) * 0.30, -t * 0.55));
      float smoke  = texture2D(uScorch, uv + vec2(0.0, 0.07)).a
                     * smoothstep(0.59, 0.965, smokeN) * 0.14 * uFade;

      // ---------- emblem, warped by the rising heat ----------
      vec2 luv = (uv - uRect.xy) / uRect.zw;
#if SHIMMER
      float haze = texture2D(uBloom, uv + vec2(0.0, 0.045)).a * heat;
      vec2  shim = vec2(fbm(p * 7.0 + vec2(0.0, -t * 2.6)) - 0.5,
                       (fbm(p * 7.0 + vec2(19.0, 5.0) + vec2(0.0, -t * 2.6)) - 0.5) * 0.5);
      luv += shim * haze * 0.011;
#endif

      vec4  lg = texture2D(uLogo, clamp(luv, 0.0, 1.0));
      float inside = step(0.0, luv.x) * step(luv.x, 1.0) * step(0.0, luv.y) * step(luv.y, 1.0);
      lg.a *= inside;

      // char glows from within while it is still burning
      float lit  = clamp(band * heat * 1.25 + d * 0.40, 0.0, 1.0);
      vec3  lcol = lg.rgb + fireRamp(clamp(lit, 0.0, 1.0)) * lit * lit * 0.85;

      // ---------- composite: scorch | flames behind | emblem | flames in front | smoke ----------
      vec3  P = scorchCol * aScorch;
      float A = aScorch;

      vec3  Pe = cFlame * aFlame + fireRamp(clamp(coal * 1.15, 0.0, 1.0)) * coal;
      float Ae = clamp(aFlame + coal, 0.0, 1.0);
      float bl = g2 * heat * (0.35 + 0.5 * boil) * 0.12;
      Pe += vec3(1.0, 0.42, 0.10) * bl;
      Ae  = clamp(Ae + bl * 0.5, 0.0, 1.0);

      P = Pe * 0.85 + P * (1.0 - Ae * 0.85);
      A = Ae * 0.85 + A * (1.0 - Ae * 0.85);

      float aLogo = lg.a;
      P = lcol * aLogo + P * (1.0 - aLogo);
      A = aLogo + A * (1.0 - aLogo);

      float aFront = aFlame * 0.27;
      P = cFlame * aFront + P * (1.0 - aFront);
      A = aFront + A * (1.0 - aFront);

      vec3 smokeCol = vec3(0.26, 0.22, 0.19);
      P = smokeCol * smoke + P * (1.0 - smoke);
      A = smoke + A * (1.0 - smoke);

      gl_FragColor = vec4(P, A);
    }`;

  let program = null, uT, uFade, uAspect, uRect, region = null, scaleRef = 1;

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      diag.shaderError = (gl.getShaderInfoLog(s) || 'compile failed').slice(0, 400);
      gl.deleteShader(s);
      return null;
    }
    return s;
  }

  // full quality first; if the GPU rejects it, retry with a cut-down variant
  const VARIANTS = [
    { name: 'full', prec: `    #ifdef GL_FRAGMENT_PRECISION_HIGH\n    precision highp float;\n    #else\n    precision mediump float;\n    #endif`, oct: 4, steps: 17, shimmer: true },
    { name: 'lite', prec: '    precision mediump float;',                oct: 3, steps: 10, shimmer: false }
  ];

  function makeProgram() {
    for (const v of VARIANTS) {
      const vs = compile(gl.VERTEX_SHADER, VSH);
      const fs = compile(gl.FRAGMENT_SHADER, FSH(v));
      if (!vs || !fs) { if (vs) gl.deleteShader(vs); if (fs) gl.deleteShader(fs); continue; }
      const pr = gl.createProgram();
      gl.attachShader(pr, vs); gl.attachShader(pr, fs);
      gl.linkProgram(pr);
      gl.deleteShader(vs); gl.deleteShader(fs);
      if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) {
        diag.shaderError = (gl.getProgramInfoLog(pr) || 'link failed').slice(0, 400);
        gl.deleteProgram(pr);
        continue;
      }
      diag.variant = v.name;
      return pr;
    }
    return null;
  }

  function texFromCanvas(unit, c) {
    const tex = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  }

  // Safari on iOS 16 and older silently ignores ctx.filter, which would leave every
  // mask sharp and kill the glow. Detect it and fall back to a downscale/upscale blur.
  const HAS_FILTER = (function () {
    try {
      const c = document.createElement('canvas').getContext('2d');
      if (!c || !('filter' in c)) return false;
      c.filter = 'blur(2px)';
      return c.filter === 'blur(2px)';
    } catch (e) { return false; }
  })();

  function softBlur(src, blurPx) {
    let cur = src;
    for (let pass = 0; pass < 2; pass++) {
      const k = Math.max(1.2, blurPx * 0.75);
      const dw = Math.max(1, Math.round(src.width / k));
      const dh = Math.max(1, Math.round(src.height / k));
      const small = document.createElement('canvas');
      small.width = dw; small.height = dh;
      const sc = small.getContext('2d');
      sc.imageSmoothingEnabled = true;
      sc.drawImage(cur, 0, 0, dw, dh);

      const up = document.createElement('canvas');
      up.width = src.width; up.height = src.height;
      const uc = up.getContext('2d');
      uc.imageSmoothingEnabled = true;
      uc.drawImage(small, 0, 0, src.width, src.height);
      cur = up;
    }
    return cur;
  }

  function blurCanvas(draw, w, hgt, blurPx) {
    const c = document.createElement('canvas');
    c.width = w; c.height = hgt;
    const x = c.getContext('2d');
    if (HAS_FILTER) { x.filter = 'blur(' + blurPx + 'px)'; draw(x); return c; }
    draw(x);
    return softBlur(c, blurPx);
  }

  function blurredMask(blurPx, r, mx, topPad) {
    const mw = 512, mh = Math.round(mw * region.h / region.w);
    return blurCanvas(x => x.drawImage(logo,
      (mx / region.w) * mw, (topPad / region.h) * mh,
      (r.width / region.w) * mw, (r.height / region.h) * mh), mw, mh, blurPx);
  }

  // keeps only the upward-facing rim: mask minus mask-shifted-down
  function rimSource(thick, blurPx, r, mx, topPad) {
    const mw = 512, mh = Math.round(mw * region.h / region.w);
    const c = document.createElement('canvas');
    c.width = mw; c.height = mh;
    const x = c.getContext('2d');
    const dx = (mx / region.w) * mw, dy = (topPad / region.h) * mh;
    const dw = (r.width / region.w) * mw, dh = (r.height / region.h) * mh;
    x.drawImage(logo, dx, dy, dw, dh);
    x.globalCompositeOperation = 'destination-out';
    x.drawImage(logo, dx, dy + thick, dw, dh);

    return blurCanvas(o => o.drawImage(c, 0, 0), mw, mh, blurPx);
  }

  function build() {
    const r = logo.getBoundingClientRect();
    const host = hero.getBoundingClientRect();
    if (r.width < 10 || r.height < 10) return false;
    scaleRef = r.height / 600;

    const mx     = r.width  * 0.22;
    const topPad = r.height * 0.50;
    const botPad = r.height * 0.14;
    region = {
      x: (r.left - host.left) - mx,
      y: (r.top  - host.top)  - topPad,
      w: r.width  + mx * 2,
      h: r.height + topPad + botPad
    };

    fireC.style.left   = region.x + 'px';
    fireC.style.top    = region.y + 'px';
    fireC.style.width  = region.w + 'px';
    fireC.style.height = region.h + 'px';
    fireC.width  = Math.round(region.w * baseDPR * qScale);
    fireC.height = Math.round(region.h * baseDPR * qScale);
    gl.viewport(0, 0, fireC.width, fireC.height);

    texFromCanvas(0, logo);
    texFromCanvas(1, blurredMask(2,   r, mx, topPad));
    texFromCanvas(2, blurredMask(3.5, r, mx, topPad));
    texFromCanvas(3, blurredMask(34,  r, mx, topPad));
    texFromCanvas(4, rimSource(6.5, 3.25, r, mx, topPad));
    texFromCanvas(5, blurredMask(12,  r, mx, topPad));

    if (!program) {
      program = makeProgram();
      if (!program) return false;          // fire off, plain emblem stays visible
      gl.useProgram(program);

      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(program, 'aPos');
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1i(gl.getUniformLocation(program, 'uLogo'),   0);
      gl.uniform1i(gl.getUniformLocation(program, 'uMask'),   1);
      gl.uniform1i(gl.getUniformLocation(program, 'uGlow'),   2);
      gl.uniform1i(gl.getUniformLocation(program, 'uBloom'),  3);
      gl.uniform1i(gl.getUniformLocation(program, 'uSrc'),    4);
      gl.uniform1i(gl.getUniformLocation(program, 'uScorch'), 5);
      uT      = gl.getUniformLocation(program, 'uT');
      uFade   = gl.getUniformLocation(program, 'uFade');
      uAspect = gl.getUniformLocation(program, 'uAspect');
      uRect   = gl.getUniformLocation(program, 'uRect');

      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      gl.clearColor(0, 0, 0, 0);
    }
    gl.uniform2f(uAspect, region.w / region.h, 1.0);
    gl.uniform4f(uRect, mx / region.w, topPad / region.h, r.width / region.w, r.height / region.h);

    buildEmberSpots(r, host);
    return true;
  }

  /* ============================================================
     EMBERS: buoyancy, drag, curl turbulence, blackbody cooling
     ============================================================ */
  const ectx = embC.getContext('2d');
  let EW = 0, EH = 0, spots = [];
  const parts = [];
  const MAX_PARTS = 185;
  const EMBERS_PER_SEC = 61;

  function h2(x, y) { const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return n - Math.floor(n); }
  function vnoise(x, y) {
    const ix = Math.floor(x), iy = Math.floor(y);
    let fx = x - ix, fy = y - iy;
    fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
    const a = h2(ix, iy), b = h2(ix + 1, iy), c = h2(ix, iy + 1), dd = h2(ix + 1, iy + 1);
    return a + (b - a) * fx + (c - a) * fy + (a - b - c + dd) * fx * fy;
  }
  function curl(x, y) {
    const e = 0.35;
    return [ (vnoise(x, y + e) - vnoise(x, y - e)) / (2 * e),
            -(vnoise(x + e, y) - vnoise(x - e, y)) / (2 * e) ];
  }
  function ramp(x) {
    x = x < 0 ? 0 : x > 1 ? 1 : x;
    const st = (a, b) => { const u = Math.min(1, Math.max(0, (x - a) / (b - a))); return u * u * (3 - 2 * u); };
    const mx = (A, B, k) => [A[0]+(B[0]-A[0])*k, A[1]+(B[1]-A[1])*k, A[2]+(B[2]-A[2])*k];
    let c = mx([0.10,0.005,0], [0.55,0.045,0], st(0.00, 0.16));
    c = mx(c, [0.95,0.20,0.015], st(0.13, 0.36));
    c = mx(c, [1.00,0.46,0.060], st(0.33, 0.56));
    c = mx(c, [1.00,0.70,0.200], st(0.53, 0.76));
    c = mx(c, [1.00,0.90,0.580], st(0.74, 0.92));
    c = mx(c, [1.00,0.98,0.900], st(0.90, 1.00));
    return [Math.round(c[0]*255), Math.round(c[1]*255), Math.round(c[2]*255)];
  }

  function buildEmberSpots(r, host) {
    const sw = 150, sh = Math.round(sw * r.height / r.width);
    const off = document.createElement('canvas');
    off.width = sw; off.height = sh;
    const octx = off.getContext('2d', { willReadFrequently: true });
    octx.drawImage(logo, 0, 0, sw, sh);
    const d = octx.getImageData(0, 0, sw, sh).data;
    const A = (x, y) => (x < 0 || y < 0 || x >= sw || y >= sh) ? 0 : d[(y * sw + x) * 4 + 3];
    spots = [];
    const lx = r.left - host.left, ly = r.top - host.top;
    for (let y = 0; y < sh; y++) {
      for (let x = 0; x < sw; x++) {
        if (A(x, y) <= 90) continue;
        if (A(x,y-1) > 90 && A(x,y+1) > 90 && A(x-1,y) > 90 && A(x+1,y) > 90) continue;
        spots.push({ x: lx + (x / sw) * r.width, y: ly + (y / sh) * r.height });
      }
    }
  }

  function resizeEmbers() {
    const r = embC.getBoundingClientRect();
    EW = r.width; EH = r.height;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    embC.width  = Math.round(EW * dpr);
    embC.height = Math.round(EH * dpr);
    ectx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function spawn() {
    if (!spots.length || parts.length >= MAX_PARTS) return;
    const p = spots[(Math.random() * spots.length) | 0];
    const roll = Math.random();
    const ash = roll < 0.30;
    const big = !ash && roll > 0.94;
    parts.push({
      x: p.x, y: p.y,
      vx: (Math.random() - 0.5) * 34 * scaleRef,
      vy: -(55 + Math.random() * 95) * scaleRef,
      size: (ash ? 0.8 + Math.random() * 1.5
                 : big ? 2.0 + Math.random() * 1.5
                       : 0.6 + Math.random() * 1.3) * scaleRef,
      temp: ash ? 0.12 : 0.80 + Math.random() * 0.20,
      coolRate: (ash ? 0.40 : big ? 0.20 : 0.32) + Math.random() * 0.14,
      spin: (Math.random() - 0.5) * 5,
      rot: Math.random() * Math.PI,
      ash, seed: Math.random() * 100
    });
  }

  function step(dt, fade) {
    if (fade > 0.02 && !reduced) {
      acc += dt * EMBERS_PER_SEC * fade;
      while (acc >= 1) { spawn(); acc -= 1; }
    } else acc = 0;

    const G = 62 * scaleRef, LIFT = 250 * scaleRef, CURL = 78 * scaleRef;
    for (let i = parts.length - 1; i >= 0; i--) {
      const e = parts[i];
      e.temp -= e.coolRate * dt * (fade < 0.02 ? 3.0 : 1.0);
      if (!e.ash && Math.random() < dt * 0.5) e.temp = Math.min(1, e.temp + 0.22);
      if (e.temp <= 0.015 || e.y < -40 || e.y > EH + 40) { parts.splice(i, 1); continue; }

      const [cx, cy] = curl(e.x * 0.0055 + time * 0.06, e.y * 0.0055 - time * 0.22);
      e.vx += (cx * CURL) * dt;
      e.vy += (cy * CURL * 0.7 + G - LIFT * e.temp) * dt;

      const drag = Math.exp(-(e.ash ? 2.2 : 1.15) * dt);
      e.vx *= drag; e.vy *= drag;
      e.x += e.vx * dt; e.y += e.vy * dt;
      e.rot += e.spin * dt;
    }
  }

  function draw() {
    ectx.clearRect(0, 0, EW, EH);

    ectx.globalCompositeOperation = 'source-over';
    for (const e of parts) {
      if (!e.ash) continue;
      const a = Math.min(1, e.temp / 0.12) * 0.42;
      ectx.save();
      ectx.translate(e.x, e.y);
      ectx.rotate(e.rot);
      ectx.fillStyle = 'rgba(48,38,31,' + a + ')';
      ectx.beginPath();
      ectx.ellipse(0, 0, e.size * 1.5, e.size * 0.5, 0, 0, Math.PI * 2);
      ectx.fill();
      ectx.restore();
    }

    ectx.globalCompositeOperation = 'lighter';
    ectx.lineCap = 'round';
    for (const e of parts) {
      if (e.ash) continue;
      const fl = 0.62 + 0.38 * Math.sin(time * 11.3 + e.seed) * Math.sin(time * 6.7 + e.seed * 1.7);
      const T = Math.min(1, e.temp * fl);
      const [r, g, b] = ramp(T);
      const a = Math.min(1, e.temp * 1.15) * fl;

      const k = 0.026;
      ectx.strokeStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + (a * 0.42) + ')';
      ectx.lineWidth = e.size * 1.5;
      ectx.beginPath();
      ectx.moveTo(e.x - e.vx * k, e.y - e.vy * k);
      ectx.lineTo(e.x, e.y);
      ectx.stroke();

      const halo = e.size * (3.0 + 2.4 * T);
      const rg = ectx.createRadialGradient(e.x, e.y, 0, e.x, e.y, halo);
      rg.addColorStop(0,    'rgba(' + r + ',' + Math.round(g * 0.8) + ',' + b + ',' + (a * 0.30) + ')');
      rg.addColorStop(0.42, 'rgba(' + r + ',' + Math.round(g * 0.45) + ',6,' + (a * 0.10) + ')');
      rg.addColorStop(1,    'rgba(200,40,0,0)');
      ectx.fillStyle = rg;
      ectx.beginPath();
      ectx.arc(e.x, e.y, halo, 0, Math.PI * 2);
      ectx.fill();

      ectx.globalCompositeOperation = 'source-over';
      ectx.fillStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + Math.min(1, a * 1.1) + ')';
      ectx.beginPath();
      ectx.arc(e.x, e.y, e.size * 1.05, 0, Math.PI * 2);
      ectx.fill();
      ectx.globalCompositeOperation = 'lighter';
    }
  }

  /* ============================================================
     TIMELINE
     ============================================================ */
  const smooth = x => x * x * (3 - 2 * x);

  let last = 0, time = 0, flameTime = 0, acc = 0, running = false, finished = false;
  let frames = 0, tSum = 0, tuned = false;

  function timeline(tt) {
    const up   = Math.min(1, tt / RAMP);
    const down = Math.max(0, 1 - (tt - RAMP - HOLD) / FADE);
    return smooth(Math.min(up, down));
  }

  function render(fade) {
    if (!region) return;
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(uT, flameTime);
    gl.uniform1f(uFade, fade);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  function settle() {
    // one last frame in the finished state, then the loop stops for good
    render(0);
    ectx.clearRect(0, 0, EW, EH);
    running = false;
    finished = true;
    hero.classList.add('sd-done');
  }

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now; time += dt; flameTime += dt * TIME_SCALE;

    const fade = timeline(time);
    render(fade);
    step(dt, fade);
    draw();

    if (!tuned) {
      frames++; tSum += dt;
      if (frames === 60) { tuned = true; if (tSum / frames > 0.028) { qScale = 0.65; build(); } }
    }

    // only after the burn has actually happened, or it would settle on frame one
    if (time > RAMP + HOLD && fade <= 0.001) {
      hero.classList.add('sd-done');
      if (parts.length === 0) { settle(); return; }
    }
    requestAnimationFrame(frame);
  }

  function play() {
    if (running) return;
    parts.length = 0; acc = 0; time = 0; flameTime = 0;
    running = true; finished = false;
    hero.classList.remove('sd-done');
    requestAnimationFrame(t => { last = t; frame(t); });
  }

  let startTries = 0;
  function start() {
    if (!gl) { if (DEBUG) showDiag(); return; }   // no WebGL: the plain <img> stays
    try {
      diag.canvasFilter = HAS_FILTER;
      if (!build()) {
        // layout may not be settled yet; retry briefly, then give up quietly
        if (!program && diag.shaderError) { if (DEBUG) showDiag(); return; }
        if (++startTries < 120) { requestAnimationFrame(start); return; }
        if (DEBUG) showDiag();
        return;
      }
      hero.classList.add('sd-gl');
      resizeEmbers();
      play();
      if (DEBUG) showDiag();
    } catch (e) {
      diag.shaderError = diag.shaderError || String((e && e.message) || e);
      hero.classList.remove('sd-gl');
      console.warn('[snapdraken] fire effect disabled:', e);
      if (DEBUG) showDiag();
    }
  }

  // phones can drop the WebGL context when backgrounded; without this the hero
  // would go blank, since the <img> is hidden while WebGL is driving
  fireC.addEventListener('webglcontextlost', e => {
    e.preventDefault();
    running = false;
    hero.classList.remove('sd-gl');
  }, false);
  fireC.addEventListener('webglcontextrestored', () => {
    program = null;
    if (build()) { hero.classList.add('sd-gl'); settle(); }
  }, false);

  if (logo.complete && logo.naturalWidth) start();
  else logo.addEventListener('load', start);

  // click or tap the hero to watch it burn in again
  hero.addEventListener('click', () => { if (finished) play(); });

  let rT;
  window.addEventListener('resize', () => {
    clearTimeout(rT);
    rT = setTimeout(() => {
      resizeEmbers();
      build();
      if (finished) settle();              // redraw the finished state at the new size
    }, 150);
  });
})();
</script>

</body>
</html>
